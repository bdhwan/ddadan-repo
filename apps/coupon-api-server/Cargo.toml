[package]
name = "coupon-api-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "DDADAN store coupon and loyalty API server"

[lib]
name = "coupon_api_server"
path = "src/lib.rs"

[[bin]]
name = "coupon-api"
path = "src/main.rs"

[[bin]]
name = "coupon-worker"
path = "src/bin/coupon_worker.rs"

# 인수 시나리오(§20)와 실기기 검증(§19.5)이 필요로 하는 상태를 만드는 도구.
[[bin]]
name = "coupon-seed"
path = "src/bin/coupon_seed.rs"

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
apalis.workspace = true
apalis-redis.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
ed25519-dalek.workspace = true
figment.workspace = true
hex.workspace = true
hmac.workspace = true
http.workspace = true
http-body-util.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
redis.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
uuid.workspace = true
validator.workspace = true
x509-cert.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
# `tests/acceptance.rs` 는 서버와 워커를 실제 프로세스로 띄운다. 테스트 바이너리가 죽었을
# 때 그 프로세스들이 살아남으면 다음 실행이 낡은 서버와 붙어 진단 불가능한 실패를 내므로,
# prctl(PR_SET_PDEATHSIG) 로 커널에게 같이 죽이라고 시킨다.
libc = "0.2"
