@if (screen(); as s) {
  <div class="stage" [style.background]="s.background ?? '#0c0f1a'" [style.aspect-ratio]="aspect()">
    @for (item of s.items; track item.id) {
      <div
        class="item"
        [style.left.%]="(item.x / s.width) * 100"
        [style.top.%]="(item.y / s.height) * 100"
        [style.width.%]="(item.width / s.width) * 100"
        [style.height.%]="(item.height / s.height) * 100"
        [style.z-index]="item.zIndex ?? 1"
        [style.background]="item.background ?? null"
        [style.color]="item.color ?? null"
        [style.font-size.px]="item.fontSize ?? null"
      >
        @switch (item.kind) {
          @case ('image') {
            <img [src]="absoluteUrl(item)" alt="" />
          }
          @case ('video') {
            <video [src]="absoluteUrl(item)" autoplay muted loop playsinline></video>
          }
          @default {
            <div class="text">{{ item.text }}</div>
          }
        }
      </div>
    }
  </div>
} @else {
  <div class="loading">DDADAN 플레이어 연결 중...</div>
}
